[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Mini-GPT-from-Scratch"
version = "1.0"
description = "A character-level mini-GPT built from basic PyTorch components."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
]
keywords = ["gpt", "transformer", "attention", "pytorch", "language-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools]
py-modules = ["attention", "bigram", "data", "model", "training"]
